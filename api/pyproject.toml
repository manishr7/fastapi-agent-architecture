[project]
name = "fastapi-agent-architecture"
version = "0.1.0"
description = "FastAPI reference backend with rules that constrain AI coding agents to a frozen architecture"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncmy>=0.2.9",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "import-linter>=2.1",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
show-fixes = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "W",      # warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "RET",    # better returns
    "RUF",    # Ruff rules
    "N",      # naming
    "ASYNC",  # async issues
]

ignore = [
    "E501",
]

fixable = ["ALL"]


[tool.ruff.lint.per-file-ignores]
"app/core/exceptions.py" = ["N818"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.importlinter]
root_package = "app"

# Enforces 07-use-cases.md / 13-transactions.md's "Router -> Use Case ->
# Repository -> Database, never reversed." import-linter's layers contract
# only forbids upward imports (a lower layer importing a higher one) — it
# does not forbid a higher layer skipping past an adjacent one (e.g. a
# router importing repositories directly). That narrower, skip-level case
# is not covered here; catching it would need a second contract type or
# the same kind of small custom check as the commit()/rollback() test in
# tests/test_architecture_boundaries.py.
[[tool.importlinter.contracts]]
name = "Module layering: router -> use_cases -> repositories -> domain, never reversed"
type = "layers"
layers = [
    "router",
    "use_cases",
    "repositories",
    "domain",
]
containers = [
    "app.modules.auth",
    "app.modules.health",
]

# Enforces 01-folder-structure.md's "app/api/ contains ONLY APIRouter
# instantiation and include_router() calls... MUST NOT contain endpoint
# implementations, business logic, use cases, repositories, SQL, or
# schemas." This checks the clearest, most severe version of that rule —
# direct persistence/infrastructure access — not every possible violation.
[[tool.importlinter.contracts]]
name = "app/api/ is HTTP composition only: no direct database or infrastructure access"
type = "forbidden"
source_modules = [
    "app.api",
]
forbidden_modules = [
    "app.database",
    "app.infrastructure",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
