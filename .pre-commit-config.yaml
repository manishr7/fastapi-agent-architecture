repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project api ruff check --fix
        language: system
        files: ^api/
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project api ruff format
        language: system
        files: ^api/
        types: [python]
